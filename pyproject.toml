[project]
name = "fannagent"
version = "0.2.0"
description = "Offline, budgeted policy generation for filtered ANN databases"
requires-python = ">=3.12,<3.14"
readme = "README.md"
dependencies = ["mini-swe-agent==2.4.6", "pydantic>=2.11,<3", "typer>=0.16,<1", "numpy>=2,<3", "pyarrow>=19,<24", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1", "mypy>=1.18,<2"]

[project.scripts]
fannagent = "fannagent.cli:main"
fannagent-tool = "fannagent.tool_client:main"
fannagent-workspace-build = "fannagent.build_workspace:main"

[project.entry-points."fannagent.backends"]
fake = "fannagent.backends.fake:extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fannagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Docker and instrumented engine images"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.sdist]
exclude = ["deferred/**", "tests/extensions/independent/dist/**"]
