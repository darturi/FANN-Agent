[project]
name = "fannagent-test-extension"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fannagent>=0.2,<0.3"]
[project.entry-points."fannagent.backends"]
independent = "independent_extension:extension"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/independent_extension"]
